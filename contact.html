<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoVida | Contacto</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4fbf6; color: #17351f; }
    nav { background: #236b3b; padding: 16px; text-align: center; }
    nav a { color: white; margin: 0 14px; text-decoration: none; font-weight: bold; }
    main { max-width: 850px; margin: 50px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 16px #0002; }
    h1 { color: #236b3b; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; border: 1px solid #9ab8a3; border-radius: 6px; }
    button { margin-top: 16px; background: #236b3b; color: white; border: 0; padding: 11px 18px; border-radius: 7px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="about.html">Nosotros</a>
    <a href="contact.html">Contacto</a>
  </nav>
  <main>
    <h1>Contacto</h1>
    <form>
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" required>
      <label for="correo">Correo</label>
      <input id="correo" name="correo" type="email" required>
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
      <button type="submit">Enviar</button>
    </form>
  </main>
</body>
</html>
